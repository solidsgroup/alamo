schema_version: 1

defaults:
  overrides:
    - elastic.solver.verbose=5
    - elastic.print_model=0
    - amr.plot_int=1
    - amr.thermo.plot_int=1
    - amr.thermo.int=1
    - stop_time=1e99_s
    - elastic.interval=1

cases:
  - id: canonical_2d_elastic
    input: input
    dim: 2
    max_step: 2
    hardware: [local, nova]
    np:
      cpu: 1
      gpu: 1
    overrides: []
