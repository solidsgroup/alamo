      function bindBuilderEvents() {
        bindDefaultPlaceholders();
        builderList.querySelectorAll("[data-prefix-toggle]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const key = event.currentTarget.dataset.prefixToggle;
            if (state.prefixCollapsed[key]) delete state.prefixCollapsed[key];
            else state.prefixCollapsed[key] = true;
            renderBuilder();
          });
        });
        builderList.querySelectorAll("[data-section-toggle]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const node = flat[Number(event.currentTarget.dataset.sectionToggle)];
            if (state.collapsed[node._path]) delete state.collapsed[node._path];
            else state.collapsed[node._path] = true;
            renderBuilder();
          });
        });
        builderList.querySelectorAll("[data-switch-path]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const node = nodeForPath(event.currentTarget.dataset.switchPath);
            state.switches[node._path] = event.currentTarget.dataset.switchValue;
            renderAll();
          });
          if (button.getAttribute("role") === "tab") {
            button.addEventListener("keydown", (event) => {
              if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
              event.preventDefault();
              const tabs = Array.from(event.currentTarget.parentElement.querySelectorAll('[role="tab"]'));
              const current = tabs.indexOf(event.currentTarget);
              let next = current;
              if (event.key === "ArrowLeft") next = (current - 1 + tabs.length) % tabs.length;
              if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
              if (event.key === "Home") next = 0;
              if (event.key === "End") next = tabs.length - 1;
              const path = tabs[next].dataset.switchPath;
              const value = tabs[next].dataset.switchValue;
              state.switches[path] = value;
              renderAll();
              requestAnimationFrame(() => {
                Array.from(builderList.querySelectorAll('[role="tab"][data-switch-path]'))
                  .find((tab) => tab.dataset.switchPath === path && tab.dataset.switchValue === value)
                  ?.focus();
              });
            });
          }
        });
        builderList.querySelectorAll("[data-value-path]").forEach((control) => {
          const eventName = control.tagName === "SELECT" ? "change" : "input";
          control.addEventListener(eventName, (event) => {
            const node = nodeForPath(event.currentTarget.dataset.valuePath);
            state.values[node._path] = event.currentTarget.value;
            refreshAfterValue(node);
          });
        });
        builderList.querySelectorAll("[data-seq-value]").forEach(bindSequenceValueInput);
        builderList.querySelectorAll("[data-seq-delete]").forEach(bindSequenceDeleteButton);
        builderList.querySelectorAll("[data-class-add]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const path = event.currentTarget.dataset.classAdd;
            const count = Number(state.classSequenceCounts[path] || 0);
            state.classSequenceCounts[path] = count + 1;
            state.classSequenceActive[path] = count;
            renderAll();
          });
        });
        builderList.querySelectorAll("[data-class-tab]").forEach((button) => {
          button.addEventListener("click", (event) => {
            state.classSequenceActive[event.currentTarget.dataset.classTab] =
              Number(event.currentTarget.dataset.index);
            renderAll();
          });
        });
        builderList.querySelectorAll("[data-class-remove]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const path = event.currentTarget.dataset.classRemove;
            const index = Number(event.currentTarget.dataset.index);
            const count = Number(state.classSequenceCounts[path] || 0);
            removeStatePrefix(path + index);
            for (let next = index + 1; next < count; next += 1) {
              moveStatePrefix(path + next, path + (next - 1));
            }
            state.classSequenceCounts[path] = Math.max(0, count - 1);
            state.classSequenceActive[path] = Math.min(index, Math.max(0, count - 2));
            renderAll();
          });
        });
      }

      function outputLines() {
        const lines = ["# Generated by the Alamo input builder", "# Schema source: __SCHEMA_SOURCE__", ""];
        const appendInstance = (node) => {
          if (!node._path || !nodeActive(node)) return;
          if (node.kind === "switch") {
            const value = state.switches[node._path];
            if (value !== undefined && value !== "") lines.push(node._path + " = " + value);
          } else if (isClassSequence(node)) {
            instancesForClassSequence(node).forEach(appendInstance);
            return;
          } else if (node.kind === "sequence") {
            (state.sequenceRows[node._path] || []).forEach((row, index) => {
              const value = String(row.value || "").trim();
              if (value) lines.push(node._path + index + " = " + value);
            });
          } else if (node.kind === "parameter") {
            const value = String(state.values[node._path] || "").trim();
            if (value) lines.push(node._path + " = " + value);
            else if (node.required) lines.push("# " + node._path + " = <value>");
          }
          (node.children || []).forEach(appendInstance);
        };
        flat.forEach((node) => {
          if (classSequenceOwner(node)) return;
          if (!node._path || !nodeActive(node)) return;
          if (node.kind === "switch") {
            const value = state.switches[node._path];
            if (value !== undefined && value !== "") lines.push(node._path + " = " + value);
            return;
          }
          if (node.kind === "sequence") {
            if (isClassSequence(node)) {
              instancesForClassSequence(node).forEach(appendInstance);
              return;
            }
            (state.sequenceRows[node._path] || []).forEach((row, index) => {
              const value = String(row.value || "").trim();
              if (value) lines.push(node._path + index + " = " + value);
            });
            return;
          }
          if (node.kind !== "parameter") return;
          const value = String(state.values[node._path] || "").trim();
          if (value) lines.push(node._path + " = " + value);
          else if (node.required) lines.push("# " + node._path + " = <value>");
        });
        return lines;
      }

      function renderOutput() {
        const lines = outputLines();
        outputText.value = lines.join("\n").replace(/\n{3,}/g, "\n\n");
        lineCount.textContent = lines.length + " lines";
      }

      function renderStatus() {
        const issues = validationIssues();
        statusSummary.classList.toggle("has-errors", issues.length > 0);
        statusSummary.innerHTML = '<span class="status-dot"></span><span>' + (
          issues.length ? issues.length + " items need attention" : "Current configuration is complete"
        ) + '</span>';
        const decisions = switchNodes.filter(nodeActive).map((node) => {
          const value = state.switches[node._path];
          return node._path + " = " + (value === "" ? "Default" : value);
        });
        activeDecisions.textContent = decisions.join("  /  ");
        activeDecisions.title = decisions.join("\n");
      }

      function renderAll() {
        reconcileSwitches();
        ensureState();
        renderBuilder();
        renderNavigation();
        renderStatus();
        renderOutput();
      }

      function resetState() {
        Object.keys(state.switches).forEach((key) => delete state.switches[key]);
        Object.keys(state.values).forEach((key) => delete state.values[key]);
        Object.keys(state.sequenceRows).forEach((key) => delete state.sequenceRows[key]);
        Object.keys(state.classSequenceCounts).forEach((key) => delete state.classSequenceCounts[key]);
        Object.keys(state.classSequenceActive).forEach((key) => delete state.classSequenceActive[key]);
        Object.keys(state.collapsed).forEach((key) => delete state.collapsed[key]);
        Object.keys(state.prefixCollapsed).forEach((key) => delete state.prefixCollapsed[key]);
        state.search = "";
        state.view = "all";
        state.currentSection = "";
        searchInput.value = "";
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === "all");
        });
        renderAll();
      }

      searchInput.addEventListener("input", (event) => {
        state.search = event.currentTarget.value.trim().toLowerCase();
        renderAll();
      });

      document.querySelectorAll("[data-view]").forEach((button) => {
        button.addEventListener("click", (event) => {
          state.view = event.currentTarget.dataset.view;
          document.querySelectorAll("[data-view]").forEach((item) => item.classList.toggle("active", item === event.currentTarget));
          renderAll();
        });
      });

      document.getElementById("resetButton").addEventListener("click", resetState);
      document.getElementById("builderSelect").addEventListener("change", (event) => {
        window.location.href = event.currentTarget.value;
      });
      document.getElementById("copyButton").addEventListener("click", () => {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(outputText.value);
        else {
          outputText.focus();
          outputText.select();
          document.execCommand("copy");
        }
      });
      document.getElementById("downloadButton").addEventListener("click", () => {
        const blob = new Blob([outputText.value + "\n"], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "alamo-inputs.in";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById("schemaSummary").textContent =
        flat.filter((node) => node.kind === "parameter").length + " parameters  /  " +
        switchNodes.length + " decisions  /  " +
        flat.filter((node) => node.kind === "sequence").length + " repeatable inputs";

      if (traversalIgnored.length) {
        const sources = traversalIgnored.map((item) => {
          const source = item.source || {};
          const location = source.file ? source.file + ":" + (source.line || "?") : "legacy parser";
          const note = item.note || "Its inputs are not fully documented.";
          return location + ": " + note;
        });
        traversalNotice.hidden = false;
        traversalNotice.textContent = "Legacy input parser skipped during documentation traversal. " + sources.join(" ");
      }

      renderAll();
    }());
  </script>
</body>
</html>
