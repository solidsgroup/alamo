<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root {
      --c0: #1f77b4;
      --c1: #ff7f0e;
      --c2: #2ca02c;
      --c3: #d62728;
      --c4: #9467bd;
      --c5: #8c564b;
      --c6: #e377c2;
      --c7: #7f7f7f;
      --c8: #bcbd22;
      --c9: #17becf;
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-subtle: #f8f8f8;
      --line: #d9d9d9;
      --line-strong: #bdbdbd;
      --text: #262626;
      --muted: #666666;
      --accent: var(--c0);
      --accent-soft: #eaf2f8;
      --accent-line: #8fbbd7;
      --conditional: var(--c0);
      --conditional-soft: var(--accent-soft);
      --success: var(--c2);
      --red: var(--c3);
      --red-soft: #fceeee;
      --group: var(--c4);
      --group-soft: #f5f0f8;
      --group-line: #c9b4da;
      --focus: var(--c0);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 6px 11px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    button:hover { border-color: var(--focus); }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid rgba(31, 119, 180, 0.28);
      outline-offset: 1px;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    button.danger {
      border-color: #e6a3a4;
      color: var(--red);
    }

    input[type="text"],
    input[type="search"],
    select,
    textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 7px 9px;
      background: var(--surface);
      color: var(--text);
    }

    input[data-default-placeholder]::placeholder {
      color: #778079;
      font-style: italic;
      opacity: 0.68;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.97);
    }

    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 680;
      letter-spacing: 0;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .actions,
    .toolbar,
    .view-tabs,
    .status-summary,
    .switch-options {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .actions { gap: 8px; }

    .workspace {
      max-width: 1660px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 170px minmax(560px, 1fr) minmax(320px, 350px);
      gap: 24px;
      align-items: start;
      padding: 20px 22px 36px;
    }

    .section-nav {
      position: sticky;
      top: 84px;
      min-width: 0;
      max-height: calc(100vh - 104px);
      overflow-y: auto;
    }

    .nav-title,
    .panel-title,
    .toolbar-title {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .nav-title { padding: 0 8px 8px; }

    .nav-list { display: grid; gap: 2px; }

    .nav-link {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      border: 0;
      border-radius: 4px;
      padding: 5px 8px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .nav-link:hover,
    .nav-link.current {
      background: var(--accent-soft);
      color: var(--text);
    }

    .nav-link-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-count {
      min-width: 22px;
      color: var(--c7);
      font-size: 12px;
      text-align: right;
    }

    .nav-link.has-errors .nav-count {
      color: var(--red);
      font-weight: 700;
    }

    .form-column { min-width: 0; }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      justify-content: space-between;
      gap: 12px;
    }

    .search-wrap { min-width: 0; }

    .view-tabs { gap: 0; }

    .view-tab {
      min-height: 36px;
      border-radius: 0;
      border-right-width: 0;
      color: var(--muted);
    }

    .view-tab:first-child { border-radius: 5px 0 0 5px; }

    .view-tab:last-child {
      border-right-width: 1px;
      border-radius: 0 5px 5px 0;
    }

    .view-tab.active {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 650;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status-summary { flex: 0 0 auto; gap: 7px; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .status-summary.has-errors { color: var(--red); }
    .status-summary.has-errors .status-dot { background: var(--red); }

    .active-decisions {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .input-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .form-section + .form-section,
    .loose-fields + .form-section,
    .form-section + .loose-fields {
      border-top: 1px solid var(--line-strong);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 46px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 9px 14px;
      background: rgba(247, 248, 247, 0.97);
      text-align: left;
    }

    .section-heading:hover {
      border-color: var(--line);
      background: #f0f3f0;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    .section-name {
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      font-weight: 700;
    }

    .section-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .section-caret {
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid currentColor;
      transition: transform 120ms ease;
    }

    .section-heading[aria-expanded="true"] .section-caret { transform: rotate(90deg); }

    .section-body,
    .scope-body { min-width: 0; }

    .subsection { border-top: 1px solid #e8e8e8; }

    .subsection-heading {
      padding: 12px 14px 6px;
      color: #4d4d4d;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .conditional-group {
      border-top: 1px solid var(--accent-line);
      border-left: 3px solid var(--conditional);
      background: var(--conditional-soft);
    }

    .flow-branch > .scope-body {
      margin-left: 12px;
    }

    .flow-section-heading {
      border-top: 1px solid #e8e8e8;
      padding: 9px 14px 5px;
      color: #4d4d4d;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .conditional-heading {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding: 10px 13px 6px;
      color: var(--accent);
      font-size: 12px;
    }

    .conditional-heading code {
      color: #4d4d4d;
      font-weight: 650;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(210px, 310px);
      gap: 22px;
      align-items: center;
      min-height: 62px;
      border-top: 1px solid #e8e8e8;
      padding: 10px 14px;
      background: transparent;
    }

    .section-body > .field-row:first-child,
    .scope-body > .field-row:first-child { border-top: 0; }

    .field-row:hover { background: #fafbfa; }

    .field-row.configured { box-shadow: inset 3px 0 0 var(--success); }

    .field-row.missing-required { background: var(--red-soft); }

    .field-row.missing-required .input-label,
    .required-mark { color: var(--red); }

    .field-row.missing-required input[type="text"],
    .field-row.missing-required select {
      border-color: #e08081;
      background: #fffdfd;
    }

    .input-name,
    .field-control { min-width: 0; }

    .input-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input-label,
    #outputText {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .input-label {
      font-size: 12px;
      font-weight: 700;
      word-break: break-word;
    }

    .required-mark {
      font-size: 11px;
      font-weight: 650;
    }

    .input-unit {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .input-doc {
      max-width: 720px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .switch-row {
      grid-template-columns: 1fr;
      gap: 9px;
      background: #f7faff;
    }

    .switch-options { align-items: stretch; gap: 0; }

    .switch-option {
      min-width: 0;
      min-height: 34px;
      border-radius: 0;
      border-right-width: 0;
      padding: 5px 11px;
      background: var(--surface);
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .switch-option:first-child { border-radius: 5px 0 0 5px; }

    .switch-option:last-child {
      border-right-width: 1px;
      border-radius: 0 5px 5px 0;
    }

    .switch-option.selected {
      position: relative;
      z-index: 1;
      border-color: var(--accent-line);
      border-right-width: 1px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .switch-option.selected + .switch-option { border-left-width: 0; }

    .sequence-content {
      grid-column: 1 / -1;
      display: grid;
      gap: 9px;
    }

    .sequence-entry {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(160px, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .constraint-note {
      margin: 10px 14px;
      border-left: 3px solid var(--line-strong);
      padding: 8px 10px;
      background: var(--surface-subtle);
      color: var(--muted);
      font-size: 12px;
    }

    .constraint-note.invalid {
      border-left-color: var(--red);
      background: var(--red-soft);
      color: var(--red);
    }

    .constraint-note.valid { border-left-color: var(--success); }

    .exactly-group {
      margin: 10px 12px;
      overflow: hidden;
      border: 1px solid var(--group-line);
      border-left: 3px solid var(--group);
      border-radius: 5px;
      background: var(--surface);
    }

    .exactly-group.invalid { border-color: #e08081; }

    .exactly-group-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--group-soft);
    }

    .exactly-group-title {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .exactly-group-status {
      flex: 0 0 auto;
      color: var(--red);
      font-size: 12px;
      font-weight: 650;
    }

    .exactly-group-status.valid { color: var(--success); }

    .exactly-members .field-row:first-child { border-top: 0; }

    .exactly-members .field-row { padding-left: 12px; padding-right: 12px; }

    .empty {
      padding: 36px 20px;
      color: var(--muted);
      text-align: center;
    }

    .output-pane {
      position: sticky;
      top: 84px;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      border-bottom: 1px solid var(--line);
      padding: 8px 11px;
      background: var(--surface-subtle);
    }

    .output-pane .panel-title {
      color: var(--text);
      text-transform: none;
    }

    #outputText {
      display: block;
      min-height: calc(100vh - 150px);
      border: 0;
      border-radius: 0;
      padding: 12px;
      resize: vertical;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre;
    }

    @media (max-width: 1260px) {
      .workspace { grid-template-columns: minmax(560px, 1fr) minmax(320px, 380px); }
      .section-nav { display: none; }
    }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .output-pane { position: static; }
      #outputText { min-height: 300px; max-height: 55vh; }
    }

    @media (max-width: 680px) {
      .topbar {
        position: static;
        flex-direction: column;
        align-items: stretch;
        padding: 12px 14px;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .actions button {
        min-width: 0;
        padding-left: 5px;
        padding-right: 5px;
        font-size: 12px;
      }
      .workspace { padding: 12px 0 28px; }
      .controls { padding: 0 12px; }
      .toolbar { grid-template-columns: 1fr; align-items: stretch; }
      .view-tabs { width: 100%; }

      .view-tab {
        flex: 1 1 0;
        min-width: 0;
        padding-left: 5px;
        padding-right: 5px;
        font-size: 12px;
      }

      .input-list,
      .output-pane {
        border-left: 0;
        border-right: 0;
        border-radius: 0;
      }

      .field-row { grid-template-columns: 1fr; gap: 8px; }
      .active-decisions { display: none; }
      .sequence-entry { grid-template-columns: 1fr; }

      .flow-branch > .scope-body { margin-left: 6px; }

      .switch-option,
      .switch-option:first-child,
      .switch-option:last-child {
        flex: 1 1 auto;
        border-width: 1px;
        border-radius: 4px;
        margin: 2px;
      }
    }
  </style>
</head>
<body>
  <script id="schema-data" type="application/json">__SCHEMA_JSON__</script>

  <header class="topbar">
    <div>
      <h1>__TITLE__</h1>
      <div class="subtle" id="schemaSummary"></div>
    </div>
    <div class="actions">
      <button id="resetButton" type="button">Reset</button>
      <button id="copyButton" type="button">Copy input</button>
      <button id="downloadButton" class="primary" type="button">Download input</button>
    </div>
  </header>

  <main class="workspace">
    <nav class="section-nav" aria-label="Input sections">
      <h2 class="nav-title">Sections</h2>
      <div class="nav-list" id="sectionNav"></div>
    </nav>

    <section class="form-column">
      <div class="controls">
        <div class="toolbar">
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="Search active inputs" aria-label="Search active inputs">
          </div>
          <div class="view-tabs" role="group" aria-label="Input view">
            <button class="view-tab active" type="button" data-view="all">All</button>
            <button class="view-tab" type="button" data-view="required">Required</button>
            <button class="view-tab" type="button" data-view="configured">Configured</button>
          </div>
        </div>
        <div class="status-line">
          <div class="status-summary" id="statusSummary"></div>
          <div class="active-decisions" id="activeDecisions"></div>
        </div>
      </div>
      <div class="input-list" id="builderList"></div>
    </section>

    <aside class="output-pane">
      <div class="output-header">
        <h2 class="panel-title">Generated input file</h2>
        <span class="subtle" id="lineCount"></span>
      </div>
      <textarea id="outputText" readonly spellcheck="false" aria-label="Generated input file"></textarea>
    </aside>
  </main>

  <script>
    (function () {
      "use strict";

      const envelope = JSON.parse(document.getElementById("schema-data").textContent);
      const root = envelope.root || envelope;
      const flow = Array.isArray(envelope.flow) ? envelope.flow : null;
      const flat = [];
      const switchNodes = [];
      const constraints = [];
      const nodeByPath = new Map();
      const unitsByPath = new Map();
      const state = {
        switches: Object.create(null),
        values: Object.create(null),
        sequenceRows: Object.create(null),
        collapsed: Object.create(null),
        search: "",
        view: "all",
        currentSection: ""
      };

      const builderList = document.getElementById("builderList");
      const sectionNav = document.getElementById("sectionNav");
      const searchInput = document.getElementById("searchInput");
      const outputText = document.getElementById("outputText");
      const lineCount = document.getElementById("lineCount");
      const statusSummary = document.getElementById("statusSummary");
      const activeDecisions = document.getElementById("activeDecisions");

      function pathFor(node, parentPath) {
        if (node.path !== undefined && node.path !== null) return String(node.path);
        if (node.full_name) return String(node.full_name);
        if (parentPath && node.name) return parentPath + "." + node.name;
        return node.name ? String(node.name) : "";
      }

      function walk(node, depth, parentPath, parent) {
        node._path = pathFor(node, parentPath);
        node._depth = depth;
        node._id = flat.length;
        node._parent = parent || null;
        flat.push(node);
        if (node._path) nodeByPath.set(node._path, node);
        if (node.kind === "switch") switchNodes.push(node);
        (node.constraints || []).forEach((constraint) => {
          constraints.push({ id: constraints.length, owner: node, constraint: constraint });
        });
        (node.children || []).forEach((child) => walk(child, depth + 1, node._path, node));
      }

      walk(root, 0, "", null);

      function scopeForConstraint(item) {
        const members = item.constraint.members || [];
        const candidates = flat.filter((node) => {
          return node.kind === "scope" && members.length && members.every((member) => {
            return !node._path || member === node._path || member.startsWith(node._path + ".");
          });
        });
        candidates.sort((a, b) => b._path.length - a._path.length);
        item.scopePath = candidates.length ? candidates[0]._path : "";
      }

      constraints.forEach(scopeForConstraint);
      constraints.forEach((item) => {
        (item.constraint.members || []).forEach((member, index) => {
          const unit = (item.constraint.units || [])[index];
          if (unit) unitsByPath.set(member, String(unit));
        });
      });

      function esc(value) {
        return String(value === undefined || value === null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function nodeDoc(node) {
        return String(node.description || node.doc || node.documentation || "").trim();
      }

      function renderDoc(node) {
        const doc = nodeDoc(node);
        if (!doc) return "";
        let html = esc(doc);
        html = html.replace(/:code:`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/:math:`([^`]+)`/g, "<span class=\"math\">$1</span>");
        return '<div class="input-doc">' + html + '</div>';
      }

      function conditionsActive(conditions) {
        return (conditions || []).every((condition) => {
          return String(state.switches[condition.path]) === String(condition.value);
        });
      }

      function activeContext(node) {
        return (node.contexts || []).find((context) => !context || !context.length || conditionsActive(context)) || null;
      }

      function nodeActive(node) {
        return !node.contexts || !node.contexts.length || activeContext(node) !== null;
      }

      function constraintActive(item) {
        return nodeActive(item.owner) && conditionsActive(item.constraint.conditions || []);
      }

      function optionValues(node) {
        return (node.options || []).map((option) => String(option));
      }

      function reconcileSwitches() {
        if (flow) {
          let changed = true;
          let guard = 0;
          while (changed && guard < 40) {
            changed = false;
            guard += 1;
            const visit = (nodes) => {
              (nodes || []).forEach((flowNode) => {
                if (flowNode.kind !== "switch") return;
                const options = (flowNode.branches || []).map((branch) => String(branch.value));
                if (!options.length) return;
                if (!options.includes(state.switches[flowNode.input])) {
                  state.switches[flowNode.input] = options[0];
                  changed = true;
                }
                const selected = (flowNode.branches || []).find((branch) => {
                  return String(branch.value) === String(state.switches[flowNode.input]);
                });
                if (selected) visit(selected.children);
              });
            };
            visit(flow);
          }
          return;
        }

        let changed = true;
        let guard = 0;
        while (changed && guard < 40) {
          changed = false;
          guard += 1;
          switchNodes.forEach((node) => {
            if (!nodeActive(node)) return;
            const options = optionValues(node);
            if (!options.length) return;
            if (!options.includes(state.switches[node._path])) {
              const preferred = String(node.default_value === undefined ? "" : node.default_value);
              state.switches[node._path] = options.includes(preferred) ? preferred : options[0];
              changed = true;
            }
          });
        }
      }

      function ensureState() {
        flat.forEach((node) => {
          if (!node._path) return;
          if (node.kind === "parameter" && state.values[node._path] === undefined) {
            state.values[node._path] = "";
          }
          if (node.kind === "sequence" && !Array.isArray(state.sequenceRows[node._path])) {
            state.sequenceRows[node._path] = [];
          }
        });
      }

      function defaultPlaceholder(node) {
        if (!node.has_default) return null;
        if (node.default_value !== undefined && node.default_value !== null) return String(node.default_value);
        if (node.default !== undefined && node.default !== null) return String(node.default);
        return null;
      }

      function configured(node) {
        if (node.kind === "parameter") return String(state.values[node._path] || "").trim() !== "";
        if (node.kind === "sequence") return (state.sequenceRows[node._path] || []).length > 0;
        return node.kind === "switch";
      }

      function missingRequired(node) {
        return Boolean(node.required && nodeActive(node) && !configured(node));
      }

      function searchableText(node) {
        return [node._path, node.name, node.kind, node.directive, nodeDoc(node), (node.options || []).join(" ")]
          .filter(Boolean).join(" ").toLowerCase();
      }

      function nodeMatchesView(node) {
        if (!nodeActive(node)) return false;
        if (state.view === "required" && node.kind !== "switch" && !node.required) return false;
        if (state.view === "configured" && !configured(node)) return false;
        if (state.search && !searchableText(node).includes(state.search)) return false;
        return node.kind === "parameter" || node.kind === "switch" || node.kind === "sequence";
      }

      function hasVisibleDescendant(node) {
        return (node.children || []).some((child) => {
          return nodeMatchesView(child) || hasVisibleDescendant(child);
        });
      }

      function inputVisible(node) {
        return nodeMatchesView(node) || (node.kind === "switch" && hasVisibleDescendant(node));
      }

      function scopeHasVisible(node) {
        return (node.children || []).some((child) => inputVisible(child) || hasVisibleDescendant(child));
      }

      function activeItems(node) {
        let count = 0;
        (node.children || []).forEach((child) => {
          if (inputVisible(child)) count += 1;
          count += activeItems(child);
        });
        return count;
      }

      function constraintEvaluation(item) {
        const constraint = item.constraint;
        const members = constraint.members || [];
        const chosen = members.filter((member) => {
          const node = nodeByPath.get(member);
          return (!node || nodeActive(node)) && String(state.values[member] || "").trim() !== "";
        });
        const expected = Number(constraint.count || 0);
        return { chosen: chosen, expected: expected, valid: chosen.length === expected };
      }

      function validationIssues() {
        const issues = [];
        flat.forEach((node) => {
          if (node.kind === "parameter" && missingRequired(node)) {
            issues.push({ path: node._path, message: "Required value missing" });
          }
        });
        constraints.forEach((item) => {
          if (!constraintActive(item) || item.constraint.kind !== "exactly") return;
          const result = constraintEvaluation(item);
          if (!result.valid) {
            issues.push({
              path: item.scopePath,
              message: "Choose exactly " + result.expected + " of " + (item.constraint.members || []).join(", ")
            });
          }
        });
        return issues;
      }

      function sectionIssueCount(node) {
        const prefix = node._path ? node._path + "." : "";
        return validationIssues().filter((issue) => issue.path === node._path || issue.path.startsWith(prefix)).length;
      }

      function renderInputName(node, includeDoc) {
        const required = node.required ? '<span class="required-mark">Required</span>' : "";
        const unit = unitsByPath.has(node._path) ? '<span class="input-unit">' + esc(unitsByPath.get(node._path)) + '</span>' : "";
        return (
          '<div class="input-name">' +
            '<div class="input-title"><span class="input-label">' + esc(node._path) + '</span>' + required + unit + '</div>' +
            (includeDoc === false ? "" : renderDoc(node)) +
          '</div>'
        );
      }

      function renderValueControl(node) {
        const value = state.values[node._path] || "";
        const options = node.directive === "query_exactly" ? [] : optionValues(node);
        if (options.length) {
          const optionHtml = ['<option value="">Choose a value</option>'].concat(options.map((option) => {
            return '<option value="' + esc(option) + '"' + (option === value ? " selected" : "") + '>' + esc(option) + '</option>';
          })).join("");
          return '<select data-value-id="' + node._id + '">' + optionHtml + '</select>';
        }
        const fallback = defaultPlaceholder(node);
        const placeholder = fallback === null ? "Enter a value" : fallback;
        const defaultAttr = fallback === null ? "" : ' data-default-placeholder="' + esc(fallback) + '"';
        return '<input type="text" data-value-id="' + node._id + '" value="' + esc(value) + '" placeholder="' + esc(placeholder) + '"' + defaultAttr + '>';
      }

      function renderParameter(node, includeDoc) {
        const classes = ["field-row", "parameter-row"];
        if (missingRequired(node)) classes.push("missing-required");
        if (configured(node)) classes.push("configured");
        return (
          '<div class="' + classes.join(" ") + '" data-node-path="' + esc(node._path) + '">' +
            renderInputName(node, includeDoc) +
            '<div class="field-control">' + renderValueControl(node) + '</div>' +
          '</div>'
        );
      }

      function renderSwitch(node, flowOptions) {
        const current = state.switches[node._path];
        const options = (flowOptions || optionValues(node)).map((option) => {
          const selected = option === current;
          return (
            '<button type="button" class="switch-option' + (selected ? " selected" : "") + '" ' +
              'data-switch-id="' + node._id + '" data-switch-value="' + esc(option) + '" ' +
              'aria-pressed="' + (selected ? "true" : "false") + '">' + esc(option) + '</button>'
          );
        }).join("");
        return (
          '<div class="field-row switch-row configured" data-node-path="' + esc(node._path) + '">' +
            renderInputName(node) +
            '<div class="switch-options" role="group" aria-label="Options for ' + esc(node._path) + '">' + options + '</div>' +
          '</div>'
        );
      }

      function renderSequence(node) {
        const rows = state.sequenceRows[node._path] || [];
        const entries = rows.map((row, index) => {
          return (
            '<div class="sequence-entry">' +
              '<input type="text" data-seq-key="' + node._id + '" data-row="' + index + '" value="' + esc(row.key || "") + '" aria-label="Input key" placeholder="Full input key">' +
              '<input type="text" data-seq-value="' + node._id + '" data-row="' + index + '" value="' + esc(row.value || "") + '" aria-label="Input value" placeholder="Value">' +
              '<button class="danger" type="button" data-seq-remove="' + node._id + '" data-row="' + index + '">Remove</button>' +
            '</div>'
          );
        }).join("");
        return (
          '<div class="field-row sequence-row' + (rows.length ? " configured" : "") + '" data-node-path="' + esc(node._path) + '">' +
            renderInputName(node) +
            '<div class="field-control"><button type="button" data-seq-add="' + node._id + '">Add entry</button></div>' +
            (entries ? '<div class="sequence-content">' + entries + '</div>' : "") +
          '</div>'
        );
      }

      function renderInput(node) {
        if (node.kind === "parameter") return renderParameter(node);
        if (node.kind === "switch") return renderSwitch(node);
        if (node.kind === "sequence") return renderSequence(node);
        return "";
      }

      function extraCondition(node) {
        const context = activeContext(node) || [];
        const parentContext = node._parent ? (activeContext(node._parent) || []) : [];
        return context.slice().reverse().find((condition) => {
          return switchNodes.some((item) => item._path === condition.path) &&
            !parentContext.some((parentCondition) => parentCondition.path === condition.path && String(parentCondition.value) === String(condition.value));
        }) || null;
      }

      function renderConditionalBody(condition, body, isFlowBranch) {
        return (
          '<div class="conditional-group' + (isFlowBranch ? " flow-branch" : "") + '">' +
            '<div class="conditional-heading"><span>Shown for</span><code>' + esc(condition.path) + ' = ' + esc(condition.value) + '</code></div>' +
            '<div class="scope-body">' + body + '</div>' +
          '</div>'
        );
      }

      function renderConstraint(item) {
        const result = constraintEvaluation(item);
        const members = item.constraint.members || [];
        const remaining = Math.max(0, result.expected - result.chosen.length);
        let detail;
        if (result.valid) {
          detail = "Complete: " + result.chosen.join(", ");
        } else if (remaining > 0) {
          detail = "Choose " + remaining + " more.";
        } else {
          detail = "Remove " + (result.chosen.length - result.expected) + ".";
        }
        return (
          '<div class="constraint-note ' + (result.valid ? "valid" : "invalid") + '" data-constraint-id="' + item.id + '">' +
            'Exactly ' + result.expected + ' of <strong>' + esc(members.join(", ")) + '</strong> must be set. ' + esc(detail) +
          '</div>'
        );
      }

      function renderExactlyStatus(item) {
        const result = constraintEvaluation(item);
        const text = result.valid
          ? result.expected + " of " + result.expected + " selected"
          : result.chosen.length + " of " + result.expected + " selected";
        return '<span class="exactly-group-status' + (result.valid ? " valid" : "") + '" data-constraint-status-id="' + item.id + '">' + esc(text) + '</span>';
      }

      function renderExactlyGroup(item, nodes) {
        const result = constraintEvaluation(item);
        return (
          '<section class="exactly-group' + (result.valid ? " valid" : " invalid") + '">' +
            '<div class="exactly-group-header">' +
              '<div><div class="exactly-group-title">Choose exactly ' + result.expected + ' values</div>' + renderDoc(item.constraint) + '</div>' +
              renderExactlyStatus(item) +
            '</div>' +
            '<div class="exactly-members">' + nodes.map((node) => renderParameter(node, false)).join("") + '</div>' +
          '</section>'
        );
      }

      function renderConstraintsFor(scope) {
        return constraints.filter((item) => item.scopePath === scope._path && constraintActive(item)).map(renderConstraint).join("");
      }

      function renderConstraintsBefore(path) {
        return constraints.filter((item) => {
          return constraintActive(item) && (item.constraint.members || [])[0] === path;
        }).map(renderConstraint).join("");
      }

      function flowGroup(path) {
        const dot = String(path || "").indexOf(".");
        return dot < 0 ? "" : String(path).slice(0, dot);
      }

      function renderFlowNodes(nodes) {
        let html = "";
        let run = [];
        let runGroup = null;
        const consumedExactlyMembers = new Set();
        const flowInputs = new Set((nodes || []).map((node) => node.input));

        const flushRun = () => {
          if (!run.length) return;
          const body = run.map(({ flowNode, node }) => {
            return renderConstraintsBefore(flowNode.input) + renderInput(node);
          }).join("");
          html += runGroup && run.length > 1
            ? '<div class="flow-section"><div class="flow-section-heading">' + esc(runGroup) + '</div>' + body + '</div>'
            : body;
          run = [];
          runGroup = null;
        };

        (nodes || []).forEach((flowNode) => {
          const node = nodeByPath.get(flowNode.input);
          if (!node) return;

          if (consumedExactlyMembers.has(flowNode.input)) return;

          const exactly = constraints.find((item) => {
            const members = item.constraint.members || [];
            return item.constraint.kind === "exactly" && constraintActive(item) &&
              members[0] === flowNode.input && members.every((member) => flowInputs.has(member));
          });
          if (exactly) {
            flushRun();
            const memberNodes = (exactly.constraint.members || []).map((member) => nodeByPath.get(member)).filter((member) => {
              return member && member.kind === "parameter" && nodeMatchesView(member);
            });
            (exactly.constraint.members || []).forEach((member) => consumedExactlyMembers.add(member));
            if (memberNodes.length) html += renderExactlyGroup(exactly, memberNodes);
            return;
          }

          if (flowNode.kind === "switch") {
            flushRun();
            const options = (flowNode.branches || []).map((branch) => String(branch.value));
            const selectedValue = state.switches[flowNode.input];
            const selected = (flowNode.branches || []).find((branch) => {
              return String(branch.value) === String(selectedValue);
            });
            const childHtml = selected ? renderFlowNodes(selected.children) : "";
            if (nodeMatchesView(node) || childHtml) {
              html += renderSwitch(node, options);
              if (childHtml) {
                html += renderConditionalBody(
                  { path: flowNode.input, value: selectedValue }, childHtml, true);
              }
            }
            return;
          }

          if ((node.kind !== "parameter" && node.kind !== "sequence") || !nodeMatchesView(node)) {
            return;
          }
          const group = flowGroup(flowNode.input);
          if (run.length && group !== runGroup) flushRun();
          if (!run.length) runGroup = group;
          run.push({ flowNode: flowNode, node: node });
        });
        flushRun();
        return html;
      }

      function renderChildren(scope) {
        let html = renderConstraintsFor(scope);
        (scope.children || []).forEach((child) => {
          if (child.kind === "scope") {
            html += renderNestedScope(child);
          } else {
            let childHtml = inputVisible(child) ? renderInput(child) : "";
            if (hasVisibleDescendant(child)) childHtml += renderChildren(child);
            const condition = child.kind === "switch" ? extraCondition(child) : null;
            html += condition && childHtml ? renderConditionalBody(condition, childHtml) : childHtml;
          }
        });
        return html;
      }

      function renderNestedScope(node) {
        if (!nodeActive(node) || !scopeHasVisible(node)) return "";
        const body = renderChildren(node);
        const condition = extraCondition(node);
        if (condition) {
          return renderConditionalBody(condition, body);
        }
        if (activeItems(node) > 1) {
          return '<div class="subsection"><div class="subsection-heading">' + esc(node._path) + '</div><div class="scope-body">' + body + '</div></div>';
        }
        return '<div class="scope-body">' + body + '</div>';
      }

      function renderSection(node) {
        if (!nodeActive(node) || !scopeHasVisible(node)) return "";
        const collapsed = Boolean(state.collapsed[node._path]) && !state.search;
        const count = activeItems(node);
        const issues = sectionIssueCount(node);
        const issueText = issues ? '<span class="required-mark">' + issues + ' need attention</span>' : "";
        return (
          '<section class="form-section" id="section-' + node._id + '" data-section-path="' + esc(node._path) + '">' +
            '<button class="section-heading" type="button" data-section-toggle="' + node._id + '" aria-expanded="' + (collapsed ? "false" : "true") + '">' +
              '<span class="section-title"><span class="section-name">' + esc(node._path) + '</span><span class="section-count">' + count + ' inputs</span>' + issueText + '</span>' +
              '<span class="section-caret"></span>' +
            '</button>' +
            (collapsed ? "" : '<div class="section-body">' + renderChildren(node) + '</div>') +
          '</section>'
        );
      }

      function renderBuilder() {
        if (flow) {
          const html = renderFlowNodes(flow);
          builderList.innerHTML = html || '<div class="empty">No active inputs match this view.</div>';
          bindBuilderEvents();
          return;
        }

        let html = "";
        let loose = "";
        function flushLoose() {
          if (!loose) return;
          html += '<div class="loose-fields">' + loose + '</div>';
          loose = "";
        }
        (root.children || []).forEach((node) => {
          if (node.kind === "scope") {
            flushLoose();
            html += renderSection(node);
          } else if (inputVisible(node)) {
            loose += renderInput(node);
            if (hasVisibleDescendant(node)) loose += renderChildren(node);
          }
        });
        flushLoose();
        builderList.innerHTML = html || '<div class="empty">No active inputs match this view.</div>';
        bindBuilderEvents();
      }

      function renderNavigation() {
        const links = (root.children || []).filter((node) => node.kind === "scope" && nodeActive(node) && scopeHasVisible(node)).map((node) => {
          const issues = sectionIssueCount(node);
          return (
            '<button type="button" class="nav-link' + (issues ? " has-errors" : "") + (state.currentSection === node._path ? " current" : "") + '" data-nav-id="' + node._id + '">' +
              '<span class="nav-link-label">' + esc(node._path) + '</span>' +
              '<span class="nav-count">' + (issues ? issues + "!" : activeItems(node)) + '</span>' +
            '</button>'
          );
        }).join("");
        sectionNav.innerHTML = links || '<div class="subtle">No sections</div>';
        sectionNav.querySelectorAll("[data-nav-id]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const node = flat[Number(event.currentTarget.dataset.navId)];
            if (flow) {
              state.currentSection = node._path;
              renderNavigation();
              const target = Array.from(builderList.querySelectorAll("[data-node-path]")).find((element) => {
                const path = element.dataset.nodePath || "";
                return path === node._path || path.startsWith(node._path + ".");
              });
              if (target) target.scrollIntoView({ block: "start" });
              return;
            }
            delete state.collapsed[node._path];
            state.currentSection = node._path;
            renderBuilder();
            renderNavigation();
            const target = document.getElementById("section-" + node._id);
            if (target) target.scrollIntoView({ block: "start" });
          });
        });
      }

      function bindDefaultPlaceholders() {
        builderList.querySelectorAll("[data-default-placeholder]").forEach((input) => {
          input.addEventListener("focus", (event) => {
            if (!event.currentTarget.value) event.currentTarget.placeholder = "";
          });
          input.addEventListener("blur", (event) => {
            if (!event.currentTarget.value) event.currentTarget.placeholder = event.currentTarget.dataset.defaultPlaceholder;
          });
        });
      }

      function syncField(node) {
        const row = builderList.querySelector('[data-node-path="' + CSS.escape(node._path) + '"]');
        if (!row) return;
        row.classList.toggle("missing-required", missingRequired(node));
        row.classList.toggle("configured", configured(node));
      }

      function refreshConstraintNotes() {
        builderList.querySelectorAll("[data-constraint-id]").forEach((element) => {
          const item = constraints[Number(element.dataset.constraintId)];
          const replacement = document.createElement("div");
          replacement.innerHTML = renderConstraint(item);
          element.replaceWith(replacement.firstElementChild);
        });
        builderList.querySelectorAll("[data-constraint-status-id]").forEach((element) => {
          const item = constraints[Number(element.dataset.constraintStatusId)];
          const group = element.closest(".exactly-group");
          const replacement = document.createElement("div");
          replacement.innerHTML = renderExactlyStatus(item);
          element.replaceWith(replacement.firstElementChild);
          if (group) group.classList.toggle("invalid", !constraintEvaluation(item).valid);
          if (group) group.classList.toggle("valid", constraintEvaluation(item).valid);
        });
      }

      function refreshAfterValue(node) {
        syncField(node);
        refreshConstraintNotes();
        renderNavigation();
        renderStatus();
        renderOutput();
      }

      function bindBuilderEvents() {
        bindDefaultPlaceholders();
        builderList.querySelectorAll("[data-section-toggle]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const node = flat[Number(event.currentTarget.dataset.sectionToggle)];
            if (state.collapsed[node._path]) delete state.collapsed[node._path];
            else state.collapsed[node._path] = true;
            renderBuilder();
          });
        });
        builderList.querySelectorAll("[data-switch-id]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const node = flat[Number(event.currentTarget.dataset.switchId)];
            state.switches[node._path] = event.currentTarget.dataset.switchValue;
            renderAll();
          });
        });
        builderList.querySelectorAll("[data-value-id]").forEach((control) => {
          const eventName = control.tagName === "SELECT" ? "change" : "input";
          control.addEventListener(eventName, (event) => {
            const node = flat[Number(event.currentTarget.dataset.valueId)];
            state.values[node._path] = event.currentTarget.value;
            refreshAfterValue(node);
          });
        });
        builderList.querySelectorAll("[data-seq-add]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const node = flat[Number(event.currentTarget.dataset.seqAdd)];
            const rows = state.sequenceRows[node._path] || [];
            rows.push({ key: node._path + rows.length, value: "" });
            state.sequenceRows[node._path] = rows;
            renderAll();
          });
        });
        builderList.querySelectorAll("[data-seq-remove]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const node = flat[Number(event.currentTarget.dataset.seqRemove)];
            state.sequenceRows[node._path].splice(Number(event.currentTarget.dataset.row), 1);
            renderAll();
          });
        });
        builderList.querySelectorAll("[data-seq-key]").forEach((input) => {
          input.addEventListener("input", (event) => {
            const node = flat[Number(event.currentTarget.dataset.seqKey)];
            state.sequenceRows[node._path][Number(event.currentTarget.dataset.row)].key = event.currentTarget.value;
            refreshAfterValue(node);
          });
        });
        builderList.querySelectorAll("[data-seq-value]").forEach((input) => {
          input.addEventListener("input", (event) => {
            const node = flat[Number(event.currentTarget.dataset.seqValue)];
            state.sequenceRows[node._path][Number(event.currentTarget.dataset.row)].value = event.currentTarget.value;
            refreshAfterValue(node);
          });
        });
      }

      function outputLines() {
        const lines = ["# Generated by the Alamo input builder", "# Schema source: __SCHEMA_SOURCE__", ""];
        flat.forEach((node) => {
          if (!node._path || !nodeActive(node)) return;
          if (node.kind === "switch") {
            const value = state.switches[node._path];
            if (value !== undefined && value !== "") lines.push(node._path + " = " + value);
            return;
          }
          if (node.kind === "sequence") {
            (state.sequenceRows[node._path] || []).forEach((row) => {
              const key = String(row.key || "").trim();
              const value = String(row.value || "").trim();
              if (key && value) lines.push(key + " = " + value);
              else if (key) lines.push("# " + key + " = <value>");
            });
            return;
          }
          if (node.kind !== "parameter") return;
          const value = String(state.values[node._path] || "").trim();
          if (value) lines.push(node._path + " = " + value);
          else if (node.required) lines.push("# " + node._path + " = <value>");
        });
        return lines;
      }

      function renderOutput() {
        const lines = outputLines();
        outputText.value = lines.join("\n").replace(/\n{3,}/g, "\n\n");
        lineCount.textContent = lines.length + " lines";
      }

      function renderStatus() {
        const issues = validationIssues();
        statusSummary.classList.toggle("has-errors", issues.length > 0);
        statusSummary.innerHTML = '<span class="status-dot"></span><span>' + (
          issues.length ? issues.length + " items need attention" : "Current configuration is complete"
        ) + '</span>';
        const decisions = switchNodes.filter(nodeActive).map((node) => node._path + " = " + state.switches[node._path]);
        activeDecisions.textContent = decisions.join("  /  ");
        activeDecisions.title = decisions.join("\n");
      }

      function renderAll() {
        reconcileSwitches();
        ensureState();
        renderBuilder();
        renderNavigation();
        renderStatus();
        renderOutput();
      }

      function resetState() {
        Object.keys(state.switches).forEach((key) => delete state.switches[key]);
        Object.keys(state.values).forEach((key) => delete state.values[key]);
        Object.keys(state.sequenceRows).forEach((key) => delete state.sequenceRows[key]);
        Object.keys(state.collapsed).forEach((key) => delete state.collapsed[key]);
        state.search = "";
        state.view = "all";
        state.currentSection = "";
        searchInput.value = "";
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === "all");
        });
        renderAll();
      }

      searchInput.addEventListener("input", (event) => {
        state.search = event.currentTarget.value.trim().toLowerCase();
        renderAll();
      });

      document.querySelectorAll("[data-view]").forEach((button) => {
        button.addEventListener("click", (event) => {
          state.view = event.currentTarget.dataset.view;
          document.querySelectorAll("[data-view]").forEach((item) => item.classList.toggle("active", item === event.currentTarget));
          renderAll();
        });
      });

      document.getElementById("resetButton").addEventListener("click", resetState);
      document.getElementById("copyButton").addEventListener("click", () => {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(outputText.value);
        else {
          outputText.focus();
          outputText.select();
          document.execCommand("copy");
        }
      });
      document.getElementById("downloadButton").addEventListener("click", () => {
        const blob = new Blob([outputText.value + "\n"], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "alamo-inputs.in";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById("schemaSummary").textContent =
        flat.filter((node) => node.kind === "parameter").length + " parameters  /  " +
        switchNodes.length + " decisions  /  " +
        flat.filter((node) => node.kind === "sequence").length + " repeatable inputs";

      renderAll();
    }());
  </script>
</body>
</html>
