---
name: Coverage

"on":
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    name: Run regression test suite and collect coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh
      - name: Configure (2D)
        run: ./configure --dim=2 --coverage --comp=g++
      - name: Build (2D)
        run: make
      - name: Configure (3D)
        run: ./configure --dim=3 --coverage --comp=g++
      - name: Build (3D)
        run: make
      - name: Regression Tests & Coverage (2D/3D)
        id: regression
        continue-on-error: true
        run: >
          scripts/runtests.py --serial
          --timeout=50 --permit-timeout
          --coverage --no-backspace --comp=g++
      - name: Generate Coverage Report
        run: make cov-report
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./cov
      - name: Propagate regression failure
        if: ${{ steps.regression.outcome != 'success' }}
        run: exit 1
