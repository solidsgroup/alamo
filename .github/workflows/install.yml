name: Install

on:
  push:
    branches: ["development", "master","candidate","candidate-install"]
  pull_request:
    branches:
    - development

permissions:
  contents: read

# Newer pushes cancel older runs, except on master/development: each of
# their commits gets its own group so every one is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/development' }}

jobs:
  install-ubuntu-22-04:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: running the install script
      run: bash .github/workflows/dependencies-ubuntu-22.04.sh
    - name: build and test
      run: bash .github/workflows/build-and-test.sh --comp=g++
  install-ubuntu-24-04:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: running the install script
      run: bash .github/workflows/dependencies-ubuntu-24.04.sh
    - name: build and test
      run: bash .github/workflows/build-and-test.sh
    - name: documentation
      run: bash .github/workflows/build-docs.sh
    - name: python
      run: bash .github/workflows/python.sh
  install-python:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: running the install script
      run: bash .github/workflows/dependencies-ubuntu-24.04.sh
    - name: python
      run: bash .github/workflows/python.sh
  install-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: running the install script
      run: bash .github/workflows/install-macos.sh
