---
name: Versioned Documentation

"on":
  push:
    branches:
      - master
      - development
      - pp-update
  delete:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  discover:
    name: Find existing documentation artifacts
    runs-on: ubuntu-24.04
    outputs:
      current_version: ${{ steps.context.outputs.current_version }}
      master_run_id: ${{ steps.artifacts.outputs.master_run_id }}
      development_run_id: ${{ steps.artifacts.outputs.development_run_id }}
      pp_update_run_id: ${{ steps.artifacts.outputs.pp_update_run_id }}
      pp_update_exists: ${{ steps.artifacts.outputs.pp_update_exists }}
      coverage_run_id: ${{ steps.artifacts.outputs.coverage_run_id }}
    if: ${{ github.event_name != 'delete' || github.event.ref == 'pp-update' }}
    steps:
      - name: Determine current documentation version
        id: context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "delete" ]; then
            current_version="$DEFAULT_BRANCH"
          else
            current_version="$GITHUB_REF_NAME"
          fi
          case "$current_version" in
            master|development|pp-update) ;;
            *)
              echo "Unsupported documentation branch: $current_version" >&2
              exit 1
              ;;
          esac
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Locate latest unexpired artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_run_id()
          {
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // ""'
          }

          echo "master_run_id=$(artifact_run_id docs-master)" >> "$GITHUB_OUTPUT"
          echo "development_run_id=$(artifact_run_id docs-development)" >> "$GITHUB_OUTPUT"
          echo "pp_update_run_id=$(artifact_run_id docs-pp-update)" >> "$GITHUB_OUTPUT"
          coverage_run_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=coverage-report&per_page=100" \
              --jq '[.artifacts[] |
                select(.expired == false and .workflow_run.head_branch == "development")
              ][0].workflow_run.id // ""'
          )"
          echo "coverage_run_id=$coverage_run_id" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/branches/pp-update" > /dev/null 2>&1; then
            echo "pp_update_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "pp_update_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build_current:
    name: Build current branch documentation
    needs: discover
    if: ${{ needs.discover.result == 'success' }}
    uses: ./.github/workflows/docs-build.yml
    with:
      source_ref: ${{ needs.discover.outputs.current_version }}
      version: ${{ needs.discover.outputs.current_version }}

  rebuild_master:
    name: Rebuild missing master documentation
    needs: discover
    if: >-
      ${{
        needs.discover.outputs.current_version != 'master' &&
        needs.discover.outputs.master_run_id == ''
      }}
    uses: ./.github/workflows/docs-build.yml
    with:
      source_ref: master
      version: master

  rebuild_development:
    name: Rebuild missing development documentation
    needs: discover
    if: >-
      ${{
        needs.discover.outputs.current_version != 'development' &&
        needs.discover.outputs.development_run_id == ''
      }}
    uses: ./.github/workflows/docs-build.yml
    with:
      source_ref: development
      version: development

  rebuild_pp_update:
    name: Rebuild missing pp-update documentation
    needs: discover
    if: >-
      ${{
        needs.discover.outputs.pp_update_exists == 'true' &&
        needs.discover.outputs.current_version != 'pp-update' &&
        needs.discover.outputs.pp_update_run_id == ''
      }}
    uses: ./.github/workflows/docs-build.yml
    with:
      source_ref: pp-update
      version: pp-update

  assemble:
    name: Assemble versioned Pages site
    runs-on: ubuntu-24.04
    needs:
      - discover
      - build_current
      - rebuild_master
      - rebuild_development
      - rebuild_pp_update
    if: >-
      ${{
        always() &&
        needs.discover.result == 'success' &&
        needs.build_current.result == 'success' &&
        (needs.rebuild_master.result == 'success' || needs.rebuild_master.result == 'skipped') &&
        (needs.rebuild_development.result == 'success' || needs.rebuild_development.result == 'skipped') &&
        (needs.rebuild_pp_update.result == 'success' || needs.rebuild_pp_update.result == 'skipped')
      }}
    steps:
      - name: Download master documentation
        uses: actions/download-artifact@v4
        with:
          name: docs-master
          path: site/docs/master
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{
              (needs.discover.outputs.current_version == 'master' ||
               needs.rebuild_master.result == 'success') &&
              github.run_id ||
              needs.discover.outputs.master_run_id
            }}

      - name: Download development documentation
        uses: actions/download-artifact@v4
        with:
          name: docs-development
          path: site/docs/development
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{
              (needs.discover.outputs.current_version == 'development' ||
               needs.rebuild_development.result == 'success') &&
              github.run_id ||
              needs.discover.outputs.development_run_id
            }}

      - name: Download pp-update documentation
        if: ${{ needs.discover.outputs.pp_update_exists == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: docs-pp-update
          path: site/docs/pp-update
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: >-
            ${{
              (needs.discover.outputs.current_version == 'pp-update' ||
               needs.rebuild_pp_update.result == 'success') &&
              github.run_id ||
              needs.discover.outputs.pp_update_run_id
            }}

      - name: Download latest coverage report
        if: ${{ needs.discover.outputs.coverage_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: site/cov
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.discover.outputs.coverage_run_id }}

      - name: Add default-version redirects and compatibility paths
        run: |
          mkdir -p site/docs site/inputs site/input-schemas
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=docs/development/">' \
            '<link rel="canonical" href="docs/development/">' \
            '<title>Alamo documentation</title>' \
            > site/index.html
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=development/">' \
            '<link rel="canonical" href="development/">' \
            '<title>Alamo documentation</title>' \
            > site/docs/index.html

          builder_version=development
          if [ ! -d "site/docs/$builder_version/_static/input-builders" ]; then
            builder_version="${{ needs.discover.outputs.current_version }}"
          fi
          test -d "site/docs/$builder_version/_static/input-builders"
          test -d "site/docs/$builder_version/_static/input-schemas"
          cp -a "site/docs/$builder_version/_static/input-builders/." site/inputs/
          cp -a "site/docs/$builder_version/_static/input-schemas/." site/input-schemas/
          find site/inputs -type f -name '*.html' -exec \
            sed -i "s#../../doxygen/#../docs/$builder_version/doxygen/#g" {} +
          touch site/.nojekyll

      - name: Verify assembled site
        run: |
          test -f site/docs/master/index.html
          test -f site/docs/development/index.html
          if [ "${{ needs.discover.outputs.pp_update_exists }}" = "true" ]; then
            test -f site/docs/pp-update/index.html
          fi
          test -f site/inputs/index.html
          test -f site/input-schemas/input-scrape-coverage.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy versioned documentation
    needs: assemble
    if: ${{ always() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
