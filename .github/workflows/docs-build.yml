---
name: Build Documentation Artifact

"on":
  workflow_call:
    inputs:
      source_ref:
        description: Git branch or tag to document
        required: true
        type: string
      version:
        description: URL-safe documentation version name
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch or tag to document
        required: true
        type: string
      version:
        description: URL-safe documentation version name
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.version }} documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ${{ inputs.source_ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh

      - name: Build 2D executables
        run: |
          ./configure --dim=2 --comp=clang++
          make -j2

      - name: Build 3D executables
        run: |
          ./configure --dim=3 --comp=clang++
          make -j2

      - name: Build documentation
        run: make docs

      - name: Record documentation source
        env:
          DOCUMENTATION_VERSION: ${{ inputs.version }}
          DOCUMENTATION_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          manifest = {
              "version": os.environ["DOCUMENTATION_VERSION"],
              "source_ref": os.environ["DOCUMENTATION_SOURCE_REF"],
              "source_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
          }
          Path("docs/build/html/alamo-docs-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ inputs.version }}
          path: docs/build/html
          if-no-files-found: error
          retention-days: 90
