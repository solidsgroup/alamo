---
name: Linux

"on":
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source and documentation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tabs
        run: .github/workflows/style/check_tabs.py
      - name: Install eclint
        run: npm install -g eclint
      - name: Check EditorConfig compliance
        run: eclint check src/
      - name: Check documentation coverage
        run: python3 scripts/checkdoc.py

  build-2d-gcc:
    name: Build 2D GCC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh
      - name: Configure
        run: ./configure --dim=2 --comp=g++
      - name: Build
        run: make -j2
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: executables-2d-gcc
          path: bin/*-2d-g++
          if-no-files-found: error
          retention-days: 2

  test-2d-gcc:
    name: Test 2D GCC (shard ${{ matrix.shard }})
    needs: build-2d-gcc
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: executables-2d-gcc
          path: bin
      - name: Restore executable permissions
        run: chmod +x bin/*-2d-g++
      - name: Run regression shard
        run: >-
          scripts/runtests.py --serial --no-coverage --dim=2
          --benchmark=github --timeout=200 --no-backspace --comp=g++
          --shard-count=3 --shard-index=${{ matrix.shard }}
      - name: Package report
        if: always()
        run: python3 scripts/package_report.py --name test-2d-gcc-${{ matrix.shard }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-2d-gcc-${{ matrix.shard }}
          path: test-2d-gcc-${{ matrix.shard }}

  test-mpi-2d-gcc:
    name: Test selected 2D MPI cases
    needs: build-2d-gcc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: executables-2d-gcc
          path: bin
      - name: Restore executable permissions
        run: chmod +x bin/*-2d-g++
      - name: Run MPI regressions
        run: >-
          scripts/runtests.py
          tests/Unit tests/Scratch tests/RubberPressurizedHole tests/TopOp
          --sections 2d-parallel parallel --dim=2 --no-coverage
          --check-mpi --mpirun-flags="--oversubscribe"
          --timeout=200 --no-backspace --comp=g++
      - name: Package report
        if: always()
        run: python3 scripts/package_report.py --name test-mpi-2d-gcc
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-mpi-2d-gcc
          path: test-mpi-2d-gcc

  test-3d-gcc:
    name: Build and test 3D GCC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh
      - name: Configure
        run: ./configure --dim=3 --comp=g++
      - name: Build
        run: make -j2
      - name: Run serial regressions
        run: >-
          scripts/runtests.py --serial --no-coverage --dim=3
          --benchmark=github --timeout=200 --no-backspace --comp=g++
      - name: Check MPI
        run: >-
          scripts/runtests.py tests/Unit --sections 3d-parallel --dim=3
          --no-coverage --check-mpi --mpirun-flags="--oversubscribe"
          --no-backspace --comp=g++
      - name: Package report
        if: always()
        run: python3 scripts/package_report.py --name test-3d-gcc
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-3d-gcc
          path: test-3d-gcc

  clang-smoke:
    name: Clang build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh
      - name: Configure
        run: ./configure --dim=2 --comp=clang++
      - name: Build
        run: make -j2
      - name: Run serial and MPI unit tests
        run: >-
          scripts/runtests.py tests/Unit --dim=2 --no-coverage
          --check-mpi --mpirun-flags="--oversubscribe"
          --no-backspace --comp=clang++

  fft:
    name: Clang FFT tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash .github/workflows/dependencies-ubuntu-24.04.sh
      - name: Install FFTW
        run: sudo apt install libfftw3-dev
      - name: Configure
        run: ./configure --dim=2 --comp=clang++ --fft
      - name: Build
        run: make -j2
      - name: Run FFT regressions
        run: >-
          scripts/runtests.py --serial --no-coverage --dim=2 --comp=clang++
          --timeout=200 --no-backspace --fft-only
